[build-system]
requires = ["setuptools >= 77.0.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "problemtools"
authors = [
    {name = "Kattis AB", email = "contact@kattis.com"},
]
description = "Kattis Problem Tools"
readme = "README.md"
license = "MIT"
keywords = ["kattis", "problemtools", "icpc", "clics"]
requires-python = ">= 3.11"

dynamic = [ "version", "dependencies" ]

[project.scripts]
verifyproblem = "problemtools.verifyproblem:main"
problem2html = "problemtools.problem2html:main"
problem2pdf = "problemtools.problem2pdf:main"

[project.urls]
Repository = "https://github.com/Kattis/problemtools"
Homepage = "https://www.kattis.com"
Documentation = "https://www.kattis.com/problem-package-format/"
Issues = "https://github.com/Kattis/problemtools/issues/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["problemtools", "problemtools.*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools_scm]
version_file = "problemtools/_version.py"
local_scheme = "no-local-version"

[tool.ruff]
line-length = 130
exclude = [ "examples" ]

[tool.ruff.lint]
ignore = [
    "BLE001",  # Do not catch blind exception - we have several places where we do want to catch Exception
    "EXE001",  # Shebang is present but file is not executable - harmless (and used to detect python2/3 in legacy problem packagse)
    "SIM102",  # Use a single `if` statement instead of nested `if` statements - stylistic, stacking if:s can improve readability
]

[tool.ruff.format]
quote-style = "single"
